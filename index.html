<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Voice Tag</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>

/* Layout: one narrow column of quiet frosted cards; rows appear only when the chosen mode needs them; one solid primary capsule. */
:root {
  --bg: #f1f2f6;
  --blob1: rgba(10, 122, 255, 0.13);
  --blob2: rgba(48, 190, 200, 0.10);
  --fg: #15171c;
  --fg2: rgba(21, 23, 28, 0.55);
  --glass: rgba(255, 255, 255, 0.66);
  --glass-solid: #fafbfd;
  --edge: rgba(255, 255, 255, 0.8);
  --shadow: rgba(30, 44, 90, 0.07);
  --line: rgba(21, 23, 28, 0.07);
  --fill: rgba(110, 118, 140, 0.13);
  --accent: #0a7aff;
  --accent-soft: rgba(10, 122, 255, 0.12);
  --accent-fg: #ffffff;
  --danger: #e0201b;
  --ok: #2fae4f;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0c10;
    --blob1: rgba(61, 139, 255, 0.16);
    --blob2: rgba(40, 170, 190, 0.09);
    --fg: #f3f4f7;
    --fg2: rgba(243, 244, 247, 0.55);
    --glass: rgba(40, 43, 55, 0.55);
    --glass-solid: #1d1f29;
    --edge: rgba(255, 255, 255, 0.10);
    --shadow: rgba(0, 0, 0, 0.30);
    --line: rgba(255, 255, 255, 0.07);
    --fill: rgba(255, 255, 255, 0.09);
    --accent: #3d8bff;
    --accent-soft: rgba(61, 139, 255, 0.20);
    --danger: #ff5a52;
    --ok: #34d058;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0c10;
  --blob1: rgba(61, 139, 255, 0.16);
  --blob2: rgba(40, 170, 190, 0.09);
  --fg: #f3f4f7;
  --fg2: rgba(243, 244, 247, 0.55);
  --glass: rgba(40, 43, 55, 0.55);
  --glass-solid: #1d1f29;
  --edge: rgba(255, 255, 255, 0.10);
  --shadow: rgba(0, 0, 0, 0.30);
  --line: rgba(255, 255, 255, 0.07);
  --fill: rgba(255, 255, 255, 0.09);
  --accent: #3d8bff;
  --accent-soft: rgba(61, 139, 255, 0.20);
  --danger: #ff5a52;
  --ok: #34d058;
  color-scheme: dark;
}

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.35;
  letter-spacing: -0.01em;
  padding-inline: 16px;
  padding-block: 40px 64px;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(55vmax 45vmax at 10% -10%, var(--blob1), transparent 62%),
    radial-gradient(50vmax 40vmax at 105% 12%, var(--blob2), transparent 60%);
}
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 4px 4px; }
h1 { font-size: 28px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 700; margin: 0; }
.theme {
  flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; display: grid; place-items: center;
  color: var(--fg); background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5);
  box-shadow: 0 4px 14px var(--shadow), inset 0 0 0 1px var(--edge);
}
.theme:hover { background: var(--glass-solid); }
h2.label { font-size: 13px; font-weight: 500; color: var(--fg2); margin: 22px 0 7px 16px; }

.card {
  position: relative; border-radius: 22px; overflow: hidden; background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5);
  box-shadow: 0 6px 20px var(--shadow), inset 0 0 0 1px var(--edge);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .card { background: var(--glass-solid); } }
.card.drag { box-shadow: 0 6px 20px var(--shadow), inset 0 0 0 2px var(--accent); }

.row {
  position: relative; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 9px 16px;
  width: 100%; margin: 0; border: 0; background: none; color: inherit; font: inherit; letter-spacing: inherit; text-align: left;
}
.row + .row::before, #beatList .row::before, #beatList + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
#beatList:empty { display: none; }
.row.link { cursor: pointer; color: var(--accent); }
.row.link:hover:not(:disabled) { background: var(--fill); }
.row.link:disabled { color: var(--fg2); cursor: default; }
.row.wrap { flex-wrap: wrap; row-gap: 8px; }
.grow { flex: 1 1 auto; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { color: var(--fg2); font-size: 14px; font-variant-numeric: tabular-nums; flex: none; }
.sub { display: block; font-size: 13px; color: var(--fg2); margin-top: 1px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.lbl { flex: none; }

.field {
  min-width: 0; border: 0; background: var(--fill); color: var(--fg); font: inherit; letter-spacing: inherit;
  padding: 7px 12px; border-radius: 999px; outline: none; text-align: center;
}
.field::placeholder { color: var(--fg2); opacity: 0.8; }
.field.num { width: 5.2em; flex: none; }
.pair { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; }
.pair .field { flex: 1 1 0; text-align: left; padding-inline: 14px; }
.pair .arrow { color: var(--fg2); flex: none; }

button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row.link:focus-visible { outline-offset: -3px; border-radius: 22px; }

.round {
  flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--fill); color: var(--fg2);
  cursor: pointer; display: grid; place-items: center; padding: 0; font: inherit; font-size: 16px; line-height: 1;
}
.round:hover:not(:disabled) { color: var(--fg); }
.round:disabled { opacity: 0.4; cursor: default; }
.round.acc { color: var(--accent); background: var(--accent-soft); }

/* beat rows */
.beat .name { font-size: 15px; display: block; }
.beat .newname { font-size: 12.5px; color: var(--accent); display: block; }
.beat .status { font-size: 13px; color: var(--fg2); font-variant-numeric: tabular-nums; flex: none; }
.beat .status.ok { color: var(--ok); }
.beat .status.err { color: var(--danger); }
.clear { color: var(--fg2); justify-content: center; font-size: 14px; min-height: 42px; }
.clear:hover:not(:disabled) { color: var(--danger); }

/* slider */
input[type="range"] { --p: 50%; -webkit-appearance: none; appearance: none; flex: 1 1 auto; min-width: 0; height: 28px; background: transparent; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p), var(--fill) var(--p)); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--fill); }
input[type="range"]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -9px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 5px rgba(0,0,0,0.3); }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 5px rgba(0,0,0,0.3); }

/* segmented + chips */
.seg { display: flex; flex: 0 1 280px; min-width: 0; padding: 2px; border-radius: 999px; background: var(--fill); gap: 2px; }
.seg button {
  flex: 1 1 0; min-width: 0; border: 0; border-radius: 999px; background: none; color: var(--fg); font: inherit; font-size: 14px;
  padding: 5px 4px; cursor: pointer; font-variant-numeric: tabular-nums;
}
.seg button.on { background: var(--glass-solid); font-weight: 600; box-shadow: 0 1px 4px var(--shadow), inset 0 0 0 1px var(--edge); }
#fitSeg { flex-basis: 100%; }
.chips { display: flex; gap: 6px; flex: none; }
.chip {
  border: 0; border-radius: 999px; background: var(--fill); color: var(--fg2); font: inherit; font-size: 14px; padding: 6px 14px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* buttons */
.primary {
  margin-top: 22px; width: 100%; height: 52px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-fg);
  font: inherit; font-weight: 600; letter-spacing: -0.01em; cursor: pointer;
}
.primary:hover:not(:disabled) { filter: brightness(1.07); }
.primary:disabled { opacity: 0.35; cursor: default; }
.outrow { display: flex; gap: 10px; margin-top: 10px; }
.btn {
  flex: 1 1 0; height: 48px; border: 0; border-radius: 999px; font: inherit; font-weight: 500; color: var(--accent); cursor: pointer;
  background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5);
  box-shadow: 0 6px 20px var(--shadow), inset 0 0 0 1px var(--edge);
}
.btn:hover { background: var(--glass-solid); }
#status { margin: 12px 12px 0; color: var(--fg2); font-size: 14px; min-height: 1.3em; text-align: center; }
#status.err { color: var(--danger); }
.note { margin: 10px 12px 0; font-size: 13px; color: var(--fg2); text-align: center; }

@media (max-width: 420px) {
  .seg { flex-basis: 100%; }
  .pair { flex-direction: column; align-items: stretch; }
  .pair .arrow { display: none; }
}

/* easter egg: five quick taps on the theme button */
.egg { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 50; }
.egg img { width: min(62vw, 300px); height: auto; filter: drop-shadow(0 18px 40px rgba(0,0,0,0.35)); animation: egg 1.5s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes egg {
  0% { opacity: 0; transform: scale(0.6) translateY(24px); }
  18% { opacity: 1; transform: scale(1.04) translateY(0); }
  28% { transform: scale(1); }
  78% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(0.96) translateY(-12px); }
}
@media (prefers-reduced-motion: reduce) { .egg img { animation: eggFade 1.5s linear forwards; } }
@keyframes eggFade { 0%, 100% { opacity: 0; } 15%, 80% { opacity: 1; } }

html { color-scheme: light; }
body { margin: 0; padding-block: 24px 40px; }
.hint-card { margin-top: 14px; }
.hint-card .row { color: var(--fg2); font-size: 14px; line-height: 1.4; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); z-index: 5; }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>Voice Tag</h1>
    <button type="button" class="theme" id="themeBtn" aria-label="Ночная тема"></button>
  </header>

  <section class="card hint-card">
    <div class="row">Войс-тег и биты присылай в чат с ботом. Здесь только настройки.</div>
  </section>

  <h2 class="label">Название</h2>
  <section class="card">
    <div class="row">
      <div class="pair">
        <input class="field" id="find" type="text" placeholder="Найти" aria-label="Найти" autocomplete="off" autocapitalize="off" spellcheck="false">
        <span class="arrow" aria-hidden="true">→</span>
        <input class="field" id="repl" type="text" placeholder="Заменить на" aria-label="Заменить на" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>
    <div class="row" style="min-height:36px">
      <span class="grow ellipsis mono" id="namePreview" style="color:var(--fg2)"></span>
    </div>
  </section>

  <h2 class="label">Звук</h2>
  <section class="card">
    <div class="row">
      <span class="lbl">Громкость</span>
      <input type="range" id="gain" min="-20" max="6" step="0.5" value="-3" aria-label="Громкость тега в децибелах">
      <span class="meta" id="gainVal" style="min-width:4.6em;text-align:right">−3,0 дБ</span>
    </div>
    <div class="row wrap">
      <span class="grow"><span>Подгонка под темп</span><span class="sub" id="fitHint"></span></span>
      <div class="seg" id="fitSeg" role="radiogroup" aria-label="Подгонка под темп">
        <button type="button" role="radio" data-v="none">Нет</button>
        <button type="button" role="radio" data-v="auto">Auto</button>
        <button type="button" role="radio" data-v="stretch">Stretch</button>
        <button type="button" role="radio" data-v="resample">Resample</button>
      </div>
    </div>
    <label class="row" for="tagBpm" id="tagBpmRow" hidden>
      <span class="grow"><span>Темп тега</span><span class="sub">BPM, на котором записан тег</span></span>
      <input class="field num" id="tagBpm" type="text" inputmode="decimal" placeholder="BPM" autocomplete="off">
    </label>
    <label class="row" for="bpm" id="bpmRow" hidden>
      <span class="grow"><span>Темп бита</span><span class="sub">Пусто: из названия файла, иначе определится сам</span></span>
      <input class="field num" id="bpm" type="text" inputmode="decimal" placeholder="Авто" autocomplete="off">
    </label>
    <div class="row wrap">
      <span class="grow"><span>Повтор</span><span class="sub">Каждые N тактов</span></span>
      <div class="seg" id="repSeg" role="radiogroup" aria-label="Повтор тега">
        <button type="button" role="radio" data-v="0">Нет</button>
        <button type="button" role="radio" data-v="2">2</button>
        <button type="button" role="radio" data-v="4">4</button>
        <button type="button" role="radio" data-v="8">8</button>
        <button type="button" role="radio" data-v="16">16</button>
      </div>
    </div>
  </section>

  <h2 class="label">Экспорт</h2>
  <section class="card">
    <div class="row">
      <span class="grow">Обрезать тишину</span>
      <div class="chips">
        <button type="button" class="chip" id="trimBeat" aria-pressed="true">Бит</button>
        <button type="button" class="chip" id="trimTag" aria-pressed="true">Тег</button>
      </div>
    </div>
    <div class="row wrap">
      <span class="grow"><span>Качество mp3</span><span class="sub">кбит/с</span></span>
      <div class="seg" id="qSeg" role="radiogroup" aria-label="Качество mp3" style="flex-basis:210px">
        <button type="button" role="radio" data-v="128">128</button>
        <button type="button" role="radio" data-v="192">192</button>
        <button type="button" role="radio" data-v="256">256</button>
        <button type="button" role="radio" data-v="320">320</button>
      </div>
      <input class="field num" id="qCustom" type="text" inputmode="numeric" aria-label="Своё значение, кбит/с" placeholder="320" autocomplete="off" style="width:4.4em">
    </div>
    <div class="row wrap">
      <span class="grow"><span>Как присылать</span><span class="sub" id="outHint"></span></span>
      <div class="seg" id="outSeg" role="radiogroup" aria-label="Как присылать" style="flex-basis:180px">
        <button type="button" role="radio" data-v="mp3">MP3</button>
        <button type="button" role="radio" data-v="zip">ZIP</button>
      </div>
    </div>
  </section>

  <button type="button" class="primary" id="save">Сохранить</button>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<div id="toast" hidden></div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  const inTg = !!(tg && tg.initData);
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const VALID = [32, 40, 48, 56, 64, 80, 96, 112, 128, 160, 192, 224, 256, 320];
  const FIT_HINT = {
    none: 'Тег вставляется как есть',
    auto: 'Длина подгоняется под целое число долей, высота сохраняется',
    stretch: 'Растягивается под темп бита, высота сохраняется',
    resample: 'Темп и высота меняются вместе, как в FL'
  };
  const OUT_HINT = { mp3: 'Каждый бит отдельным файлом', zip: 'Все биты одним архивом' };
  const DEF = { gain: -3, fit: 'none', tag_bpm: null, beat_bpm: null, repeat: 0, kbps: 320, trim_beat: true, trim_tag: true, find: '', repl: '', out: 'mp3' };

  /* ---------- settings from the bot (?s=base64url json) ---------- */
  let st = Object.assign({}, DEF);
  try {
    const raw = new URLSearchParams(location.search).get('s');
    if (raw) {
      const b64 = raw.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((raw.length + 3) % 4);
      const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
      st = Object.assign(st, JSON.parse(new TextDecoder().decode(bytes)));
    }
  } catch (e) {}

  /* ---------- helpers ---------- */
  const haptic = () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} };
  const fmtDb = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1).replace('.', ',') + ' дБ';
  const fmtBpm = (v) => (v ? String(v).replace('.', ',') : '');
  const num = (s) => { const v = parseFloat(String(s).replace(',', '.')); return isFinite(v) ? v : null; };
  const snap = (v) => VALID.reduce((a, b) => (Math.abs(b - v) < Math.abs(a - v) ? b : a));
  const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2400); }
  function markSeg(id, val) {
    document.querySelectorAll('#' + id + ' button').forEach((b) => {
      const on = b.dataset.v === String(val);
      b.classList.toggle('on', on);
      b.setAttribute('aria-checked', on ? 'true' : 'false');
    });
  }

  /* ---------- render ---------- */
  function render() {
    const g = $('gain');
    g.value = st.gain;
    g.style.setProperty('--p', ((st.gain + 20) / 26 * 100) + '%');
    $('gainVal').textContent = fmtDb(st.gain);
    markSeg('fitSeg', st.fit);
    $('fitHint').textContent = FIT_HINT[st.fit] || '';
    $('tagBpmRow').hidden = !(st.fit === 'stretch' || st.fit === 'resample');
    $('bpmRow').hidden = !(st.fit !== 'none' || st.repeat > 0);
    markSeg('repSeg', st.repeat);
    markSeg('qSeg', st.kbps);
    if (document.activeElement !== $('qCustom')) $('qCustom').value = String(st.kbps);
    markSeg('outSeg', st.out);
    $('outHint').textContent = OUT_HINT[st.out];
    $('trimBeat').setAttribute('aria-pressed', st.trim_beat ? 'true' : 'false');
    $('trimTag').setAttribute('aria-pressed', st.trim_tag ? 'true' : 'false');
    if (document.activeElement !== $('tagBpm')) $('tagBpm').value = fmtBpm(st.tag_bpm);
    if (document.activeElement !== $('bpm')) $('bpm').value = fmtBpm(st.beat_bpm);
    if (document.activeElement !== $('find')) $('find').value = st.find;
    if (document.activeElement !== $('repl')) $('repl').value = st.repl;
    const base = 'be here 152 em - silenxe x patty';
    $('namePreview').textContent = (st.find ? base.replace(new RegExp(escRe(st.find), 'gi'), () => st.repl) : base) + '.mp3';
  }

  /* ---------- controls ---------- */
  const segs = { fitSeg: (v) => (st.fit = v), repSeg: (v) => (st.repeat = Number(v)), qSeg: (v) => (st.kbps = Number(v)), outSeg: (v) => (st.out = v) };
  Object.keys(segs).forEach((id) => document.querySelectorAll('#' + id + ' button').forEach((b) =>
    b.addEventListener('click', () => { segs[id](b.dataset.v); haptic(); render(); })));
  $('gain').addEventListener('input', (e) => { st.gain = parseFloat(e.target.value); render(); });
  $('gain').addEventListener('change', haptic);
  ['trimBeat', 'trimTag'].forEach((id) => $(id).addEventListener('click', () => {
    const k = id === 'trimBeat' ? 'trim_beat' : 'trim_tag'; st[k] = !st[k]; haptic(); render();
  }));
  $('tagBpm').addEventListener('input', (e) => { const v = num(e.target.value); st.tag_bpm = v && v >= 40 && v <= 300 ? v : null; });
  $('bpm').addEventListener('input', (e) => { const v = num(e.target.value); st.beat_bpm = v && v >= 40 && v <= 300 ? v : null; });
  $('qCustom').addEventListener('input', (e) => { const v = parseInt(e.target.value, 10); if (isFinite(v) && v >= 32) { st.kbps = snap(Math.min(v, 320)); markSeg('qSeg', st.kbps); } });
  $('qCustom').addEventListener('blur', render);
  $('find').addEventListener('input', (e) => { st.find = e.target.value; render(); });
  $('repl').addEventListener('input', (e) => { st.repl = e.target.value; render(); });

  /* ---------- theme (moon / sun), starts from Telegram's theme ---------- */
  const MOON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M20.4 14.6A8.5 8.5 0 0 1 9.4 3.6a.6.6 0 0 0-.8-.7A9.5 9.5 0 1 0 21.1 15.4a.6.6 0 0 0-.7-.8z"/></svg>';
  const SUN = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  let saved = null;
  try { saved = localStorage.getItem('vt.theme'); } catch (e) {}
  function startTheme() {
    if (saved === 'dark' || saved === 'light') return saved;
    if (tg && tg.colorScheme) return tg.colorScheme;
    return mq && mq.matches ? 'dark' : 'light';
  }
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    $('themeBtn').innerHTML = t === 'dark' ? SUN : MOON;
    $('themeBtn').setAttribute('aria-label', t === 'dark' ? 'Дневная тема' : 'Ночная тема');
    if (tg) {
      const bg = t === 'dark' ? '#0b0c10' : '#f1f2f6';
      try { tg.setHeaderColor && tg.setHeaderColor(bg); tg.setBackgroundColor && tg.setBackgroundColor(bg); } catch (e) {}
    }
  }
  $('themeBtn').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('vt.theme', next); } catch (e) {}
    haptic(); applyTheme(next);
  });
  if (tg && tg.onEvent) tg.onEvent('themeChanged', () => { if (!saved) applyTheme(tg.colorScheme); });

  /* ---------- save: settings go to the bot ---------- */
  $('save').addEventListener('click', () => {
    if ((st.fit === 'stretch' || st.fit === 'resample') && !st.tag_bpm) {
      $('status').textContent = 'Укажите темп тега для режима ' + (st.fit === 'stretch' ? 'Stretch' : 'Resample') + '.';
      $('status').classList.add('err');
      $('tagBpm').focus();
      return;
    }
    $('status').textContent = ''; $('status').classList.remove('err');
    const data = JSON.stringify({ v: 1, s: st });
    if (inTg) {
      try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
      tg.sendData(data);
    } else {
      toast('Предпросмотр: в Telegram настройки уйдут боту');
    }
  });

  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  applyTheme(startTheme());
  render();
})();
</script>
